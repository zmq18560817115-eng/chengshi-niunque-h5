services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports: ["80:80"]
    volumes: ["./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
