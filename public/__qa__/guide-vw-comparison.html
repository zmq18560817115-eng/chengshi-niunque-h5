<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guide 750px VW comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eee9dc; font-family: sans-serif; }

    figure { margin: 0; }
    figcaption { height: 28px; color: #463226; font-size: 15px; font-weight: 700; }

</head>
<body>
  <main>
    <figure>
      <figcaption>素材库批准原图 · 750×1625</figcaption>

    </figure>
    <figure>
      <figcaption>当前分层运行页 · 同视口同裁切</figcaption>
      <iframe src="/go" title="当前引导页"></iframe>
    </figure>
  </main>

</html>
